[project]
name = "cpt"
version = "0.0.0"
description = "CPT — Chan Pattern Trader. A virtual currency Chan-theory analysis system."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CPT maintainers" }]
keywords = ["chan-theory", "cryptocurrency", "btcusdt", "structural-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cpt*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["references", "build", "dist", "docs"]
src = ["cpt", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"references/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["references/", "build/", "dist/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["cpt"]
omit = ["references/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
