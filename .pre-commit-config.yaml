repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: []
        additional_dependencies: ["types-requests"]

  - repo: local
    hooks:
      - id: import-linter
        name: Import Linter
        entry: import-linter
        language: system
        types: [python]
        pass_filenames: false
        args: ["lint", "--config", ".importlinter"]
