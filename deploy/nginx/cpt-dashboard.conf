# CPT Dashboard 的 Nginx 片段（`http {}` 内的 server 块，不是独立 nginx.conf）。
#
# ── 前缀：`/ecpt/cpt/`，不是 `/cpt/`（2026-10-29 对齐线上实测）──────────────
# 2026-10-26 入口重排：CPT 与 emotion 一起**收编**进 `/ecpt/` 门面（8092），
# 旧 `/cpt/`、`/emotion/` 的兼容跳转**全部删除** ⇒ 旧链接现在直接 404。
# `/ecpt/` 之下所有 location 的唯一真相源在门面项目自己的安装脚本里
# （按标记区间替换写进线上），**不在本仓**；本仓只负责保证下面这份模板
# 与线上形状一致，并说清"哪些块线上真有、哪些只是独立主机才用"。
#
# ⚠️ **本文件是"独立主机"参考模板，当前线上并没有安装它。**
#    线上把同样的 location 并入了既有的 `dsh-web` vhost（`/etc/nginx/sites-enabled/dsh-web`）。
#    原因：本机 80/443 已被 dsh-web 占用，再装一个 `listen 80` 的 server 块会冲突
#    （2026-09-25 排查 P1-6）。
#
#    要上 CPT 到现有机器上：**不要 `cp` 本文件进 sites-enabled**，把 location 块
#    摘进 dsh-web 即可。只有在独立主机/独立 vhost 上才整块使用本文件。
#
# ── 换前缀要连带改的地方（漏一处就会"改了没生效"）────────────────────────
#   - 前端**不写死**前缀：`dashboard/url_safety.js` 从 `window.location.pathname`
#     推导，`/ecpt/cpt/` 与 `/cpt/` 都能跑；`index.html` 的「我的追踪」入口也已从
#     绝对路径 `/cpt/track/` 改成相对链接 `track/`。
#   - `deploy/dashboard-sync.sh` 的 `CPT_PUBLIC_URL` 默认值（`--http` 校验用）。
#     它曾长期写着 `https://127.0.0.1/cpt`，前缀搬走后 `--http` 取回的是别处的
#     JSON 404 页，于是把"路径不对"误报成"线上跑的不是这份代码"（2026-10-29 实测）。
#   - `deploy/README.md` 里的部署步骤与 Basic Auth 一节。
#
# 与线上实测对齐过的三处：
#   - `proxy_read_timeout 15s`（线上是 15s，本模板原先写 10s）
#   - 静态块带 `try_files`（`= /ecpt/cpt/` 用 `try_files /index.html =404`，
#     前缀块用 `try_files $uri $uri/ =404`），缺了会把 404 变成目录列表/403
#   - 补上 `location = /ecpt/cpt { return 301 /ecpt/cpt/; }`
#     （线上由 `/ecpt/` 门面兜住不带尾斜杠的入口；独立主机没有门面，必须自己跳）
#
# ⚠️ 认证（R58，审计 M11）：本模板此前**一个 auth_basic 都没有**，而线上 R30 早已
#    给静态块与 API 块都挂上 `auth_basic "Restricted"` + `/etc/nginx/.htpasswd`
#    （见 deploy/README.md「`/ecpt/cpt/` 的 Basic Auth」）。
#    照本模板整块部署 = 公网上的**未认证看板 + 未认证写库 API**（M11 指出的回退路径）。
#    现按线上写法给所有承载数据的 location 补上认证；口令文件路径沿用 R30，
#    **不要把口令/默认账号写进配置**（线上口令=仓库默认值的问题见审计 S1，另行处置）。
#    ⚠️ 漏给任何一个 location 加 = 没加：`/ecpt/cpt/api/` 比 `/ecpt/cpt/` 更具体，
#       只给静态块加时，静态页 401 而 `/ecpt/cpt/api/...` 仍然匿名可写。
server {
    listen 80;
    server_name localhost;

    # 安装部署时将 dashboard/ 同步到 /var/www/cpt-dashboard/（deploy/dashboard-sync.sh）。
    root /var/www/cpt-dashboard;

    # ── 线上确实存在的四个块（形状照抄线上）────────────────────────────
    # 看板前端按 <前缀>/api/... 取数（见 dashboard/index.html 的 data-snapshot-url）。
    # 该前缀比静态块的 alias 更具体，nginx 取最长前缀匹配，不会被 alias 吞掉。
    location /ecpt/cpt/api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location = /ecpt/cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }
    location = /ecpt/cpt/track/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /track.html =404;
    }
    location /ecpt/cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /var/www/cpt-dashboard/;
        try_files $uri $uri/ =404;
    }

    # ── 以下三块**线上没有**，只服务独立主机 ────────────────────────────
    # 不带尾斜杠的入口 301 到带斜杠，否则 alias 匹配不到。
    # 301 本身不吐数据，不挂认证；认证在它指向的 location 上（浏览器会带凭据）。
    location = /ecpt/cpt {
        return 301 /ecpt/cpt/;
    }

    # 裸 /api/ 直连后台，同样承载写接口 ⇒ 必须与 /ecpt/cpt/api/ 同级认证。
    # 线上不暴露裸 /api/（只有门面的 /ecpt/ 与 CPT 的 /ecpt/cpt/api/）。
    location /api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
