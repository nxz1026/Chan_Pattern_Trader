server {
    listen 80;
    server_name localhost;

    # 安装部署时将 dashboard/ 同步到 /var/www/cpt-dashboard/。
    root /var/www/cpt-dashboard;

    location = /cpt/ {
        try_files /index.html =404;
    }
    location /cpt/ {
        alias /var/www/cpt-dashboard/;
    }

    # 看板前端按 /cpt/api/... 取数（见 dashboard/index.html 的 data-snapshot-url）。
    # 该前缀比下面的 /cpt/ alias 更具体，nginx 取最长前缀匹配，不会被 alias 吞掉。
    location /cpt/api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
