# CPT Dashboard 的 Nginx 片段（`http {}` 内的 server 块，不是独立 nginx.conf）。
#
# ⚠️ **本文件是"独立主机"参考模板，当前线上并没有安装它。**
#    线上把下面这些 location 并入了既有的 `dsh-web` vhost（监听 443 ssl），
#    见 /etc/nginx/sites-enabled/dsh-web 里的 `location = /cpt`、`location /cpt/api/`、
#    `location = /cpt/`、`location /cpt/`。原因：本机 80/443 已被 dsh-web 占用，
#    再装一个 `listen 80` 的 server 块会与它冲突（2026-09-25 排查 P1-6）。
#
#    所以要上 CPT 到现有机器上时：**不要 `cp` 本文件进 sites-enabled**，
#    把下面的 location 块摘过去加进 dsh-web 即可。只有在独立主机/独立 vhost
#    上才整块使用本文件。
#
# 与线上实测对齐过的两处：
#   - `proxy_read_timeout 15s`（线上是 15s，本模板原先写 10s）
#   - 补上 `location = /cpt { return 301 /cpt/; }`（线上有，缺了会 404）
#
# ⚠️ 认证（R58，审计 M11）：本模板此前**一个 auth_basic 都没有**，而线上 R30 早已
#    给 `/cpt/`、`= /cpt/`、`/cpt/api/` 三块挂上 `auth_basic "Restricted"` +
#    `/etc/nginx/.htpasswd`（见 deploy/README.md「/cpt/ 的 Basic Auth」）。
#    照本模板整块部署 = 公网上的**未认证看板 + 未认证写库 API**（M11 指出的回退路径）。
#    现按线上写法给所有承载数据的 location 补上认证；口令文件路径沿用 R30，
#    **不要把口令/默认账号写进配置**（线上口令=仓库默认值的问题见审计 S1，另行处置）。
#    ⚠️ 漏给任何一个 location 加 = 没加：`/cpt/api/` 比 `/cpt/` 更具体，
#       只给静态块加时，`/cpt/` 会 401 而 `/cpt/api/...` 仍然匿名可写。
server {
    listen 80;
    server_name localhost;

    # 安装部署时将 dashboard/ 同步到 /var/www/cpt-dashboard/。
    root /var/www/cpt-dashboard;

    # 不带尾斜杠的 /cpt 要 301 到 /cpt/，否则 alias 匹配不到。
    # 301 本身不吐数据，不挂认证；认证在它指向的 location 上（浏览器会带凭据）。
    location = /cpt {
        return 301 /cpt/;
    }
    location = /cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }
    location = /cpt/track/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /track.html =404;
    }
    location /cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /var/www/cpt-dashboard/;
    }

    # 看板前端按 /cpt/api/... 取数（见 dashboard/index.html 的 data-snapshot-url）。
    # 该前缀比 /cpt/ 的 alias 更具体，nginx 取最长前缀匹配，不会被 alias 吞掉。
    location /cpt/api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 裸 /api/ 直连后台，同样承载写接口 ⇒ 必须与 /cpt/api/ 同级认证。
    location /api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
