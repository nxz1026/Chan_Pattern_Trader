name: CPT CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: pytest tests -rsq
      - name: Static quality gates
        run: |
          # `scripts/` 也纳入：它是 364 行的运维入口（cron 跑 backfill），
          # 2026-09-25 之前完全不在门禁内 —— 于是它自带的 FactorRow /
          # upsert_factor_rows 两份重复实现、以及有顺序 bug 的 _code_to_tx
          # 都没人发现。只覆盖 cpt/tests 等于给运维脚本开了后门。
          ruff check cpt tests scripts
          ruff format --check cpt tests scripts
          mypy cpt scripts
      - name: Dead-code audit (vulture)
        run: |
          python -m pip install 'vulture==2.14'
          # 阈值 60（不是 80）：vulture 给「未使用的函数/类」打的置信度正是 60%，
          # 阈值 80 会把它们全部滤掉，使本步骤永远 exit 0 —— 2026-09-25 审核 P0-3。
          # 选项必须写在位置参数之前，否则 argparse 报 unrecognized arguments。
          # 不再 --exclude 'cpt/web/app.py'：那会连带隐藏 app.py 里对别处符号的真实
          # 使用（曾把 binance_futures.resolve_interval_label 误报为死代码）；
          # 改由 whitelist.py 逐条登记框架回调。
          vulture --min-confidence 60 cpt whitelist.py
