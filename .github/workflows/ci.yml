name: CPT CI

on:
  push:
  pull_request:
  # 允许在 UI / API 上重跑同一提交的 CI，不必为了重试而推一个空提交
  # （2026-09-25 排查时想验证浏览器测试是否还会 flake，但重跑需要凭据）。
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = pyproject 声明的下限（requires-python >=3.12）
        # 3.14 = 开发机 .venv 与 requirements-dev.txt 锁文件的生成版本
        # 此前只跑 3.12，而开发机是 3.14 —— "本地全绿"并不等于 CI 绿。
        # 2026-09-25 排查：用 python-build-standalone 拉真 3.12.14 实测，
        # 装上同一套可选依赖后两边结果**完全一致**（462 passed，6 项门禁全绿），
        # 所以矩阵是安全的，同时让 >=3.12 这个声明真正被验证。
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: |
          set -o pipefail
          # 失败时把尾部输出顶成 **annotation**：Actions 的原始日志要仓库 admin
          # 权限才能下载（`/actions/jobs/{id}/logs` → 403），而 annotations 是
          # 公开可读的。这样在没有凭据的环境里也能定位失败原因（2026-09-25）。
          pytest tests -rsq 2>&1 | tee pytest-output.log || {
            tail -n 40 pytest-output.log | sed 's/^/::error::/'
            exit 1
          }
      # ⚠️ **必须排在所有门禁之前**（R45 P1-2）：
      # 先验「这些门禁真能抓到它们该抓的错」，再让它们跑。
      # 顺序反了的话，一个恒返回 0 的门禁会把整条链伪装成绿的 ——
      # R45 那天就有一个门禁恒返回 0，「全绿」只是它什么都没查。
      - name: Gates self-test
        run: python scripts/selftest_gates.py

      - name: Static quality gates
        run: |
          # `scripts/` 也纳入：它是 364 行的运维入口（cron 跑 backfill），
          # 2026-09-25 之前完全不在门禁内 —— 于是它自带的 FactorRow /
          # upsert_factor_rows 两份重复实现、以及有顺序 bug 的 _code_to_tx
          # 都没人发现。只覆盖 cpt/tests 等于给运维脚本开了后门。
          ruff check cpt tests scripts
          ruff format --check cpt tests scripts
          mypy cpt scripts
          # 层契约（.importlinter 的 3 条）此前**只在本地/pre-commit 跑**，CI 从不调用
          # —— 也就是说层级可以被打破而 CI 依然全绿（2026-09-25 排查 P0-2）。
          # 依赖早已在 requirements-dev.txt 里（import-linter==2.15 + grimp==3.17）。
          lint-imports
          # 分层的**内容级**门禁：import-linter 查依赖方向，查不了「职责有没有放对层」。
          # 2026-10-01 实测 SQL 铺在 domain/application/adapters/web 四层里而 3 条契约全绿。
          python scripts/check_sql_layering.py
          # 门禁②：store 层的**失败语义**。SQL 待在对层里也可能语义写错，
          # 而 import 图看不出异常处理（R45 storage 复盘实测到 2 个真 bug）。
          # PostgreSQL 里「事务中一条语句失败 ⇒ 同一连接后续全部 aborted」，
          # 所以 catch 住 DB 异常再返回空值，不是降级，是把局部失败放大成整页失败。
          python scripts/check_storage_failure_semantics.py
          # 门禁③：文档 ↔ 代码**漂移**。前两道门禁查的是代码自己，
          # 查不到「文档在骗人」—— 而 R45 第一轮实测到 6 处，全是文档问题：
          # architecture §2.1 的 ✅ 标错 2 层且行数全偏低、dashboard-plan 写了
          # 3 个从未实现的接口、min_bi_len 的 docstring 声明比实际强。
          # 这些测试抓不到、代码审不出来，只能拿文档里的断言去对代码。
          python scripts/check_doc_drift.py
      # ⚠️ R51：以下 5 个 step 原先被上一条 `run: |` 的块标量**整段吞了进去**
      # （缩进 10 空格 = 仍在 run 文本内）⇒ bash 把 `- name: ...` 当命令执行，
      # 报 `-: command not found` → **整个 Static quality gates 步骤 exit 127**。
      # 也就是说这 5 个门禁在 CI 上**从来没真正跑过**，且整个步骤恒红。
      # 该缩进错误由 1cda27af1（R45 dashboard 拆分）引入，此前被 pytest 的红灯
      # 挡在前面、从未暴露。R51 删掉画布 D 让 pytest 转绿，它才浮出来。
      - name: Dashboard bundle in sync
        run: python scripts/build_dashboard_bundle.py --check
      # 门禁④：全量文档断言。check_doc_drift 管「有/没有」，
      # 这个管「**是不是还对得上**」—— 路径、符号、接口、表名、配置键、行号。
      # 第五轮全量扫描实测它一次抓到 1 处真漂移（architecture 说 72 个测试
      # 文件、实际 104）+ 1 个**零测试覆盖的生产 cron 作业**。
      - name: Doc claims (full sweep)
        run: python scripts/check_all_claims.py
      # 门禁⑤：文档里的**计数**断言。计数是最容易悄悄腐坏的一类，
      # 而且完全不会让任何测试变红。
      - name: Doc counts
        run: python scripts/check_doc_counts.py
      # 门禁⑥：LLM 入队骨架必须**唯一**。
      # explain 与 summarize 曾各抄一份（76+68 行）⇒ 同一个 bug 抄了两份
      # （「重复提交返回库里不存在的 call_id」在 explain 里早就在了，
      #   是补 summarize 的测试才发现）。用 AST 锁住「只有一份」。
      - name: Enqueue skeleton is unique
        run: python scripts/check_enqueue_skeleton_unique.py
      # 门禁⑦：前端「等任务」轮询必须走 cpt_job.js 的唯一实现。
      # 与凭据消毒同一个坑：R44 收敛了 9 处 url 重复实现，
      # R45 我又自己发明了一套轮询 —— 不踩第二遍。
      # **只报告不阻断**（还有 1 处语义不同的持续刷新，故意不合并）。
      - name: Frontend job polling is unique
        run: python scripts/check_job_poll_unique.py
      # 门禁⑩（R51 新增）：workflow 自己的 YAML 缩进。
      # R51 实测踩出来的：`- name:` 缩进比 `run:` 键更深 ⇒ 被块标量吞成 shell
      # 文本 ⇒ bash 报 `-: command not found`、整个步骤 exit 127，而那 5 个
      # 门禁**一次都没真跑过**。这个错不产生任何测试失败，纯靠人眼。
      # 它必须排在**所有 step 之后**（自己没被吞，才敢查别人）。
      # 编号⑨留给 `check_all_claims.py` 的 H 类（<script> 标签配对），不重复占用。
      - name: CI workflow indentation is sane
        run: python scripts/check_ci_workflow.py
      - name: Dead-code audit (vulture)
        run: |
          # vulture==2.14 自 2026-09-25 起已在 requirements-dev.txt 锁文件里，
          # 不再单独 pip install —— 那样它的版本不受锁文件约束，pre-commit 也拿不到。
          # 阈值 60（不是 80）：vulture 给「未使用的函数/类」打的置信度正是 60%，
          # 阈值 80 会把它们全部滤掉，使本步骤永远 exit 0 —— 2026-09-25 审核 P0-3。
          # 选项的摆法：放最前、放最后都可以；**唯独夹在两个位置参数中间**会报
          # `unrecognized arguments`（argparse 的 nargs='*' 被选项打断）。
          # 实测：`vulture cpt --min-confidence 60 whitelist.py` → exit 2。
          # 2026-09-25 排查更正：旧注释说"必须写在位置参数之前"，与实测不符。
          # 不再 --exclude 'cpt/web/app.py'：那会连带隐藏 app.py 里对别处符号的真实
          # 使用（曾把 binance_futures.resolve_interval_label 误报为死代码）；
          # 改由 whitelist.py 逐条登记框架回调。
          vulture --min-confidence 60 cpt whitelist.py
