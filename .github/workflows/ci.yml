name: CPT CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: pytest tests -rsq
      - name: Static quality gates
        run: |
          ruff check cpt tests
          ruff format --check cpt tests
          mypy cpt
      - name: Dead-code audit (vulture)
        run: |
          python -m pip install 'vulture==2.14'
          vulture cpt --min-confidence 80 \
            --exclude 'cpt/web/app.py'
